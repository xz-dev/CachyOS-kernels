name: Ebuild Merge Test

# Probe-only workflow: never include this file in the production IPv4 fix.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve immutable container image for this run
        id: image
        run: |
          docker pull docker.io/gentoo/stage3:latest
          IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' docker.io/gentoo/stage3:latest)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build-binpkgs:
    needs: detect-versions
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.detect-versions.outputs.image }}
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup producer and verify effective HTTPS fetch policy
        shell: bash
        run: |
          bash tests/ci-portage-setup.sh glibc "$PWD"
          python3 - <<'PY'
          import os, portage, shlex
          settings = portage.config()
          for name in ("FETCHCOMMAND", "RESUMECOMMAND"):
              value = settings.get(name + "_HTTPS") or settings[name]
              print(f"{name}={value}")
              args = shlex.split(value)
              assert os.path.basename(args[0]) == "wget" and "--inet4-only" in args
          PY
          grep -Fx 'verify-signature = true' /etc/portage/binrepos.conf/gentoo.conf
      - name: Build uncovered dependency binpkgs for the single RT case
        shell: bash
        run: |
          printf '%s\n' '7.2.10' > /var/tmp/ci-ipv4-versions.txt
          bash tests/ci-binpkg-producer.sh /var/tmp/ci-ipv4-versions.txt glibc
          test "$(cat /ci-binpkg/cases)" = '7.2.10|rt hz-ticks-1000 tickrate-full -bore -eevdf'
      - name: Upload local binpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-binpkgs-glibc-${{ github.run_id }}-${{ github.run_attempt }}
          path: /ci-binpkg/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test:
    needs: [detect-versions, build-binpkgs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["7.2.10"]
        use_flags:
          - "rt hz-ticks-1000 tickrate-full -bore -eevdf"
    container:
      image: ${{ needs.detect-versions.outputs.image }}
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download current producer artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-binpkgs-glibc-${{ github.run_id }}-${{ github.run_attempt }}
          path: /ci-binpkg
      - name: Require current attempt artifact
        if: steps.download.outcome != 'success'
        run: |
          echo '::error::Current-attempt producer artifact is required; rerun all probe jobs.'
          exit 1
      - name: Restore snapshot and verify inherited HTTPS fetch policy
        shell: bash
        run: |
          bash tests/ci-portage-setup.sh glibc "$PWD" /ci-binpkg
          python3 - <<'PY'
          import os, portage, shlex
          settings = portage.config()
          for name in ("FETCHCOMMAND", "RESUMECOMMAND"):
              value = settings.get(name + "_HTTPS") or settings[name]
              print(f"{name}={value}")
              args = shlex.split(value)
              assert os.path.basename(args[0]) == "wget" and "--inet4-only" in args
          PY
          grep -Fx 'verify-signature = true' /etc/portage/binrepos.conf/gentoo.conf
      - name: Consume binary dependencies and verify RT source package
        shell: bash
        run: |
          bash tests/ci-binpkg-consumer.sh /ci-binpkg "${{ matrix.version }}" "${{ matrix.use_flags }}"
          python3 tests/test-source-features.py \
            "sys-kernel/cachyos-sources/cachyos-sources-${{ matrix.version }}.ebuild" \
            "/usr/src/linux-${{ matrix.version }}-cachyos" "${{ matrix.use_flags }}"
